<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AROMA - Sign In</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .login-container {
            background: white;
            padding: 40px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-container h1 {
            margin-bottom: 20px;
            color: #2a5298;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .input-group label {
            font-weight: bold;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #2a5298;
            box-shadow: 0 0 5px #2a5298;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #2a5298;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #1e3c72;
            transform: scale(1.05);
        }

        .forgot {
            margin-top: 15px;
            font-size: 14px;
        }

        .forgot a {
            color: #2a5298;
            text-decoration: none;
            font-weight: bold;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <div class="login-container">
        <h1>Sign In</h1>

        <form>
            <div class="input-group">
                <label>Email:</label>
                <input type="email" placeholder="username223@gmail.com" required>
            </div>

            <div class="input-group">
                <label>Password:</label>
                <input type="password" placeholder="Password123@@@" required>
            </div>

            <button class="login-btn">Continue</button>
        </form>

        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>
    </div>

</body>
</html>
